[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-compression-toolkit"
version = "0.1.0"
description = "A reproducible experimentation toolkit for CNN compression."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "onnx>=1.16,<2",
    "onnxruntime>=1.18,<2",
    "pandas>=2.1,<3",
    "PyYAML>=6.0,<7",
    "torch>=2.2,<3",
    "torch-pruning>=1.3,<2",
    "torchvision>=0.29.1",
]

[project.optional-dependencies]
reporting = [
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
]
tui = [
    "textual>=0.79,<1",
]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
cct = "cnn_compression_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that exercise multiple project boundaries",
    "requires_data: tests requiring local datasets or checkpoints",
    "requires_onnx: tests requiring ONNX export or ONNX Runtime",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "textual>=0.79,<1",
]
